name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: |
          Z=$(git log --name-only --format= -- '*.zip' | head -1)
          echo "Usando $Z"
          unzip -q -o "$Z"
          cd MikuPet
          gradle assembleDebug --no-daemon
          mv app/build/outputs/apk/debug/app-debug.apk ../MikuApp.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MikuApp
          path: MikuApp.apk
